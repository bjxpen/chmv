name: Standalone Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone HTML
        run: STANDALONE=1 npm run standalone

      - name: Zip the standalone build (with assets)
        run: |
          cd dist-standalone
          zip -r ../chmv-standalone.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: chmv ${{ github.ref_name }} (standalone)
          body: |
            Self-contained standalone version of chmv.
            
            - Download `chmv-standalone.zip`
            - Unzip the folder and open `index.html`
            - Works directly from your filesystem (no server needed)
            - Includes the main HTML + any supporting assets
          files: |
            chmv-standalone.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}